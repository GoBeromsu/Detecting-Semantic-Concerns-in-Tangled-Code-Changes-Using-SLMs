# Configuration for gpt-oss-20b model training
model:
  id: "openai/gpt-oss-20b"
  name: "openai/gpt-oss-20b"
  new_model: "Semantic-Concern-SLM-GPT-OSS"
  dataset_name: "Berom0227/Detecting-Semantic-Concerns-in-Tangled-Code-Changes-Using-SLMs"

# LoRA configuration
lora:
  rank: 32
  alpha: 48
  dropout: 0.05

# Training hyperparameters
training:
  learning_rate: 5e-5
  num_train_epochs: 5
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  warmup_ratio: 0.1
  logging_steps: 100
  eval_steps: 100
  save_strategy: "no"
  seed: 42
  max_seq_length: 16384
  packing: true

# Technical configuration
technical:
  device_map: "auto"
  num_workers: 4

# Weights & Biases
wandb:
  project: "Untangling-Multi-Concern-Commits-with-Small-Language-Models"
  experiment_name: "gpt-oss-20b-semantic-concern-lora"

# Model card tags
tags:
  - "gpt-oss-20b"
  - "fine-tuned"
  - "commit-analysis"
  - "software-engineering"
