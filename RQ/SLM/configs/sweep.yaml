program: train.py
method: bayes
metric:
  name: train/loss
  goal: minimize
command:
  - ${env}
  - python
  - ${program}
  - --config
  - configs/qwen.yml
  - ${args}
parameters:
  learning_rate:
    values: [1e-4, 2e-4, 5e-4, 1e-3]
  lora_rank:
    values: [16, 32, 64]
  lora_alpha:
    values: [16, 32, 64, 128]