---
# RQ1 Analysis Configuration
# Configuration for all RQ1 analysis scripts

scripts:
  msg_impact_analysis:
    script: "msg_impact_analysis.py"
    description: "Analyzes the impact of commit messages on model performance"
    models:
      GPT-4.1:
        msg0_path: "results/gpt/avg_result/msg0/json/16384_zs.json"
        msg1_path: "results/gpt/avg_result/msg1/json/16384_zs.json"
      Phi-4:
        msg0_path: "results/phi/avg_result/msg0/json/16384_zs_filtered.json"
        msg1_path: "results/phi/avg_result/msg1/json/16384_zs_filtered.json"
      "Phi-4 (FT)":
        msg0_path: "results/phi_lora/avg_result/with_message_msg0/json/Phi4_16384.json"
        msg1_path: "results/phi_lora/avg_result/with_message_msg1/json/Phi4_16384.json"

  concerncount_by_model:
    script: "concerncount-by-model.py"
    description: "Generates concern count performance comparison"
    input_files:
      - "results/phi_lora/avg_result/with_message_msg1/json/Phi4_16384.json"
      - "results/phi/avg_result/msg1/json/16384_zs_filtered.json"
      - "results/gpt/avg_result/msg1/json/16384_zs.json"

  performance_summary:
    script: "performance_summary.py"
    description: "Generates performance summary comparison"
    input_files:
      - "results/phi_lora/avg_result/with_message_msg1/json/Phi4_16384.json"
      - "results/phi/avg_result/msg1/json/16384_zs_filtered.json"
      - "results/gpt/avg_result/msg1/json/16384_zs.json"

  context_length_performance:
    script: "context_length_performance.py"
    description: "Generates context length performance comparison across models"
    models:
      GPT-4.1:
        path_pattern: "results/gpt/avg_result/msg1/json/{context}_zs.json"
      Phi-4:
        path_pattern: "results/phi/avg_result/msg1/json/{context}_zs_filtered.json"
      "Phi-4 (FT)":
        path_pattern: "results/phi_lora/avg_result/with_message_msg1/json/Phi4_{context}.json"
    context_lengths: [1024, 2048, 4096, 8192, 16384]

# Execution order
execution_order:
  - "msg_impact_analysis"
  - "performance_summary"
  - "concerncount_by_model"
  - "context_length_performance"
