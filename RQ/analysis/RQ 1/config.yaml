---
# RQ1 Analysis Configuration
# Configuration for all RQ1 analysis scripts

scripts:
  msg_impact_analysis:
    script: "msg_impact_analysis.py"
    description: "Analyzes the impact of commit messages on model performance"
    models:
      GPT-4.1:
        msg0_path: "results/gpt/avg_result/msg0/json/12288_zs.json"
        msg1_path: "results/gpt/avg_result/msg1/json/12288_zs.json"
      Qwen:
        msg0_path: "results/Qwen/avg_result/msg0/json/12288_zs_filtered.json"
        msg1_path: "results/Qwen/avg_result/msg1/json/12288_zs.json"
      "Qwen (FT)":
        msg0_path: "results/Qwen3-14B-LoRA/avg_result/msg0/json/12288_zs.json"
        msg1_path: "results/Qwen3-14B-LoRA/avg_result/msg1/json/12288_zs.json"

  concerncount_by_model:
    script: "concerncount-by-model.py"
    description: "Generates concern count performance comparison"
    models:
      GPT-4.1:
        path: "results/gpt/avg_result/msg1/json/12288_zs.json"
      Qwen:
        path: "results/Qwen/avg_result/msg1/json/12288_zs.json"
      "Qwen (FT)":
        path: "results/Qwen3-14B-LoRA/avg_result/msg1/json/12288_zs.json"

  performance_summary:
    script: "performance_summary.py"
    description: "Generates performance summary comparison"
    input_files:
      - "results/Qwen3-14B-LoRA/avg_result/msg1/json/12288_zs.json"
      - "results/Qwen/avg_result/msg1/json/12288_zs.json"
      - "results/gpt/avg_result/msg1/json/12288_zs.json"

  context_length_performance:
    script: "context_length_performance.py"
    description: "Generates context length performance comparison across models"
    models:
      GPT-4.1:
        path_pattern: "results/gpt/avg_result/msg1/json/{context}_zs.json"
      Qwen:
        path_pattern: "results/Qwen/avg_result/msg1/json/{context}_zs_filtered.json"
      "Qwen (FT)":
        path_pattern: "results/Qwen3-14B-LoRA/avg_result/msg1/json/{context}_zs.json"
    context_lengths: [1024, 2048, 4096, 8192, 12288]

  model_comparison_analysis:
    script: "model_comparison_analysis.py"
    description: "Compares individual predictions between LLM, SLM, and Fine-tuned SLM models"
    models:
      LLM:
        csv_path: "results/gpt/20250906184004/msg1/12288_zs.csv"
      SLM:
        csv_path: "results/Qwen/20250921162319/msg1/12288_zs.csv"
      "Fine-tuned SLM":
        csv_path: "results/Qwen3-14B-LoRA/20250921192953/msg1/12288_zs.csv"

# Execution order
execution_order:
  - "msg_impact_analysis"
  - "performance_summary"
  - "concerncount_by_model"
  - "context_length_performance"
  - "model_comparison_analysis"
