---
# RQ1 Analysis Configuration
# Configuration for all RQ1 analysis scripts

scripts:
  msg_impact_analysis:
    script: "msg_impact_analysis.py"
    description: "Analyzes the impact of commit messages on model performance"
    models:
      GPT-4.1:
        msg0_path: "results/gpt/avg_result/msg0/12288_zs.csv"
        msg1_path: "results/gpt/avg_result/msg1/12288_zs.csv"
      Qwen:
        msg0_path: "results/Qwen/avg_result/msg0/12288_zs.csv"
        msg1_path: "results/Qwen/avg_result/msg1/12288_zs.csv"
      "Qwen (FT)":
        msg0_path: "results/Qwen3-14B-LoRA/avg_result/msg0/12288_zs.csv"
        msg1_path: "results/Qwen3-14B-LoRA/avg_result/msg1/12288_zs.csv"

  concerncount_by_model:
    script: "concerncount-by-model.py"
    description: "Generates concern count performance comparison"
    models:
      GPT-4.1:
        path: "results/gpt/avg_result/msg1/12288_zs.csv"
      Qwen:
        path: "results/Qwen/avg_result/msg1/12288_zs.csv"
      "Qwen (FT)":
        path: "results/Qwen3-14B-LoRA/avg_result/msg1/12288_zs.csv"

  performance_summary:
    script: "performance_summary.py"
    description: "Generates performance summary comparison"
    input_files:
      - "results/Qwen3-14B-LoRA/avg_result/msg1/12288_zs.csv"
      - "results/Qwen/avg_result/msg1/12288_zs.csv"
      - "results/gpt/avg_result/msg1/12288_zs.csv"

  context_length_performance:
    script: "context_length_performance.py"
    description: "Generates context length performance comparison across models"
    models:
      GPT-4.1:
        csv_path_pattern: "results/gpt/avg_result/msg1/{context}_zs.csv"
      Qwen:
        csv_path_pattern: "results/Qwen/avg_result/msg1/{context}_zs.csv"
      "Qwen (FT)":
        csv_path_pattern: "results/Qwen3-14B-LoRA/avg_result/msg1/{context}_zs.csv"
    context_lengths: [1024, 2048, 4096, 8192, 12288]

  model_comparison_analysis:
    script: "model_comparison_analysis.py"
    description: "Compares individual predictions between LLM, SLM, and Fine-tuned SLM models"
    models:
      LLM:
        csv_path: "results/gpt/avg_result/msg1/12288_zs.csv"
      SLM:
        csv_path: "results/Qwen/avg_result/msg1/12288_zs.csv"
      "Fine-tuned SLM":
        csv_path: "results/Qwen3-14B-LoRA/avg_result/msg1/12288_zs.csv"

  hamming_loss_boxplot:
    script: "hamming_loss_boxplot.py"
    description: "Generates hamming loss box plots by concern count and model"
    models:
      LLM:
        csv_path: "results/gpt/avg_result/msg1/12288_zs.csv"
      SLM:
        csv_path: "results/Qwen/avg_result/msg1/12288_zs.csv"
      "Fine-tuned SLM":
        csv_path: "results/Qwen3-14B-LoRA/avg_result/msg1/12288_zs.csv"

  context_length_boxplot:
    script: "context_length_boxplot.py"
    description: "Generates context length box plots by context length and model"
    models:
      LLM:
        csv_path_pattern: "results/gpt/avg_result/msg1/{context}_zs.csv"
      SLM:
        csv_path_pattern: "results/Qwen/avg_result/msg1/{context}_zs.csv"
      "Fine-tuned SLM":
        csv_path_pattern: "results/Qwen3-14B-LoRA/avg_result/msg1/{context}_zs.csv"
    context_lengths: [1024, 2048, 4096, 8192, 12288]

# Execution order
execution_order:
  - "msg_impact_analysis"
  - "performance_summary"
  - "concerncount_by_model"
  - "context_length_performance"
  - "model_comparison_analysis"
  - "hamming_loss_boxplot"
  - "context_length_boxplot"
