---
# RQ2 Analysis Configuration
# Configuration for all RQ2 efficiency analysis scripts

scripts:
  efficiency_commit_message:
    script: "efficiency_commit_message.py"
    description: "Analyzes correlation between commit message presence and inference time"
    input_files:
      - "results/Qwen3-14B-LoRA/avg_result/msg0/qwen_aggregated.csv"
      - "results/Qwen3-14B-LoRA/avg_result/msg1/qwen_aggregated.csv"

  efficiency_concern_count:
    script: "efficiency_concern_count.py"
    description: "Analyzes correlation between concern count and inference time"
    input_files:
      - "results/Qwen3-14B-LoRA/avg_result/msg1/qwen_aggregated.csv"

  efficiency_input_tokens:
    script: "efficiency_input_tokens.py"
    description: "Analyzes correlation between input tokens and inference time"
    input_files:
      - "results/Qwen3-14B-LoRA/avg_result/msg1/qwen_aggregated.csv"

  efficiency_concern_count_input_token:
    script: "efficiency_concern_count_input_token.py"
    description: "Multiple regression analysis of concern count and input tokens vs inference time"
    input_files:
      - "results/Qwen3-14B-LoRA/avg_result/msg1/qwen_aggregated.csv"

# Execution order
execution_order:
  - "efficiency_commit_message"
  - "efficiency_concern_count"
  - "efficiency_input_tokens"
  - "efficiency_concern_count_input_token"
