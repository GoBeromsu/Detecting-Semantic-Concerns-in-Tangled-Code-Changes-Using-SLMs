[project]
name = "detecting-multiple-semantic-concerns-in-tangled-code-commits-using-small-language-models"
version = "0.1.0"
description = "Detecting Multiple Semantic Concerns in Tangled Code Commits using Small Language Models"
readme = "README.md"
authors = [
    { name = "gobeumsu", email = "gobeumsu@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    # Core ML/Data Libraries
    "transformers>=4.55.0",
    "datasets>=2.15.0",
    "pandas>=2.1.0",
    "numpy",
    # Hugging Face & API Clients
    "huggingface_hub>=0.25.0",
    "openai>=1.0.0",
    "aiohttp>=3.8.0",
    # Configuration & Utilities
    "pyyaml",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "tiktoken>=0.4.0",
    "accelerate>=0.25.0",
    "lmstudio",
    "wandb>=0.16.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "scipy>=1.15.3",
    "scikit-learn>=1.7.2",
]

[project.optional-dependencies]
dev = [
    "torch",
    "streamlit>=1.28.0",
    "matplotlib",
    "seaborn",
    "llama-cpp-python>=0.2.79",
    "pytest>=7.4.0",
]
hpc = [

    "hf_transfer>=0.1.6",
    "sentencepiece>=0.1.99",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["utils", "visual_eval"]


[tool.pytest.ini_options]
markers = [
    "slow: long-running checks (full-dataset re-encodes, pipeline re-runs)",
    "network: requires network access",
    "gpu: requires a CUDA device",
]
